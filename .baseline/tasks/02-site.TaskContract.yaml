# Task contract template for the 02-site landing. See 01-scaffold's header.
#
# `affects` names COMPONENTS, by metadata.name: the phase's retouch hook reads
# this list to decide which component.yaml files get the redeploy marker, so
# the deploy set and the task plane's statement of the work are one list. The
# site is one component — its test runs inside it (vitest in apps/web), so
# there is no separate test package to redeploy.
apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The site is built by @sveltejs/adapter-cloudflare and live on stage and prod, its tests green
  affects:
    - web
  doneWhen:
    - main convergence green (build, deploy and smoke on stage and prod)
    - the home page answers on both workers.dev URLs
  gates: []
