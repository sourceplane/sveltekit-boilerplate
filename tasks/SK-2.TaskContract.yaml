apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: SK-2
  title: "The site on Workers"
spec:
  goal: The upstream SvelteKit boilerplate runs on Cloudflare Workers + Static Assets through @sveltejs/adapter-cloudflare with green checks
  affects:
    - apps/web
    - pnpm-lock.yaml
    - package.json
    - turbo.json
  doneWhen:
    - pnpm typecheck, lint, test and build are green in Checks
    - wrangler dev serves the three pages, the static assets and a 404
  gates:
    - checks
