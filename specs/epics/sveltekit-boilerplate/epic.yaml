# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (SK → SK-1, SK-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: sveltekit-boilerplate
  key: SK
spec:
  title: "Vercel's SvelteKit boilerplate on Cloudflare Workers"
  summary: "The Vercel SvelteKit boilerplate — the welcome page with its counter, the static about page and the todos demo (a server load and form actions that work without JavaScript; since SK3 the list lives in the visitor's own cookie, the template's hosted demo API being gone) — runs on Cloudflare Workers + Static Assets through SvelteKit's own Cloudflare adapter, inside the Cirrus baseline's repository conventions. The three-year-old 1.0-next template becomes SvelteKit 3 on Svelte 5; no OpenNext, the adapter emits the Worker, and the repository shape (intent, component, checks lane, gated Orun lane) is the one astro-boilerplate set."
  state: started
  milestones:
    - name: "SK0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [SK-1]
    - name: "SK1 — the site on Workers"
      exitCriteria:
        - "apps/web is the upstream boilerplate on SvelteKit 3 with @sveltejs/adapter-cloudflare in place of @sveltejs/adapter-auto"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` over the committed wrangler.jsonc serves / (the welcome page), /about (without JavaScript), /todos (the server load and its named actions), the static assets, and a 404 for an unknown path"
      tasks: [SK-2]
    - name: "SK2 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it, and what the todos demo talks to"
        - "the as-built status records every departure from the upstream template"
      tasks: [SK-3]
    - name: "SK3 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new site from nothing to live on stage and prod in three phases"
        - "a site built from it carries the site only, renamed throughout to its own name, repository and Worker"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [SK-4]
    - name: "SK4 — one landing"
      exitCriteria:
        - "repo-blueprint.yaml builds the site in one landing (`01-product`) and records it in a second (`03-docs`); the card's programme names the same two"
        - "a bootstrap landing is checked by `plan` alone: ci.yml skips the lanes and checks.yml its job on `orun/BASE-…` branches"
        - "Baseline CI is green, and a site bootstrapped from the next tag is live on stage and prod"
      tasks: [SK-5]
